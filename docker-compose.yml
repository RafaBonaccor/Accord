services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    dns:
      - 1.1.1.1
      - 8.8.8.8
    ports:
      - "8000:8000"
    environment:
      STRIPE_PRICE_CURRENCY: ${STRIPE_PRICE_CURRENCY:-eur}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./backend/.env
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: /api
      API_URL_SERVER: http://backend:8000
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
